name: Sync secrets to AWS (dev)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync secret values to Secrets Manager
    runs-on: ubuntu-latest
    environment:
      name: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-secrets-sync-dev-${{ github.run_id }}
          mask-aws-account-id: true
          role-duration-seconds: 900

      # Each secret here is the source of truth for its AWS Secrets Manager
      # value - set or rotate it in this repo's "dev" environment secrets
      # (Settings -> Environments -> dev), then run this workflow to push
      # it. A value left unset is skipped, so one secret can be rotated at
      # a time. Running ECS tasks read their secret once at startup, so a
      # rotated value needs a new deployment (deploy-dev.yml, or
      # `aws ecs update-service --force-new-deployment`) to take effect -
      # and if you're rotating a DB password, change it on the RDS user
      # first, since this workflow only updates Secrets Manager.
      - name: Push secret values to Secrets Manager
        env:
          AUTH_DB_PASSWORD: ${{ secrets.AUTH_DB_PASSWORD }}
          AUTH_DB_MIGRATE_PASSWORD: ${{ secrets.AUTH_DB_MIGRATE_PASSWORD }}
          LISTING_DB_PASSWORD: ${{ secrets.LISTING_DB_PASSWORD }}
          LISTING_DB_MIGRATE_PASSWORD: ${{ secrets.LISTING_DB_MIGRATE_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          set -euo pipefail

          push() {
            local secret_name="$1"
            local value="$2"
            if [ -z "${value}" ]; then
              echo "skipping ${secret_name} (no value set in the dev environment secrets)"
              return
            fi
            aws secretsmanager put-secret-value \
              --secret-id "${secret_name}" \
              --secret-string "${value}" \
              > /dev/null
            echo "updated ${secret_name}"
          }

          push auth_db_password "${AUTH_DB_PASSWORD}"
          push auth_db_migrate_password "${AUTH_DB_MIGRATE_PASSWORD}"
          push listing_db_password "${LISTING_DB_PASSWORD}"
          push listing_db_migrate_password "${LISTING_DB_MIGRATE_PASSWORD}"
          push jwt_secret_key "${JWT_SECRET_KEY}"
