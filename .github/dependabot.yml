version: 2
updates:
  - package-ecosystem: pip
    directory: /services/auth
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "auth-service"]

  - package-ecosystem: pip
    directory: /services/listings
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "listings-service"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ["dependencies", "ci"]

  - package-ecosystem: docker
    directory: /services/auth
    schedule:
      interval: weekly
    labels: ["dependencies", "docker"]

  - package-ecosystem: docker
    directory: /services/listings
    schedule:
      interval: weekly
    labels: ["dependencies", "docker"]
