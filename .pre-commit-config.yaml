repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
        args: ["--allow-multiple-documents"]
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-toml
    -   id: check-json
    -   id: check-added-large-files
        args: ["--maxkb=1024"]
    -   id: check-merge-conflict
    -   id: check-case-conflict
    -   id: mixed-line-ending
        args: ["--fix=lf"]
    -   id: detect-private-key
    -   id: forbid-submodules
-   repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
    -   id: black
        files: ^scripts/.*\.py$
-   repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
    -   id: shellcheck
-   repo: https://github.com/crate-ci/typos
    rev: v1.45.0
    hooks:
    -   id: typos
-   repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
    -   id: actionlint
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
    -   id: ruff
        name: ruff lint
        args: ["--fix", "--exit-non-zero-on-fix"]
    -   id: ruff-format
        name: ruff format
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
    -   id: mypy
        name: mypy
        stages: [pre-push]
        args: ["--config-file=pyproject.toml"]
        additional_dependencies:
          - pydantic>=2.13.5
          - pydantic-settings>=2.15.0
          - sqlalchemy>=2.0.54
          - fastapi>=0.139.0
          - types-requests
          - types-pyyaml
        files: ^services/.*/app/.*\.py$
-   repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
    -   id: bandit
        name: bandit (SAST)
        stages: [pre-push]
        args: ["-c", "pyproject.toml", "-ll"]
        additional_dependencies: ["bandit[toml]"]
        types: [python]
        exclude: ^(tests|alembic)/
-   repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
    -   id: detect-secrets
        name: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)^(
            package-lock\.json|
            \.secrets\.baseline|
            .*\.example$
          )$
-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
    -   id: gitleaks
        name: gitleaks (staged diff)
        entry: gitleaks protect --source . --verbose --staged --redact
        language: golang
        pass_filenames: false
-   repo: local
    hooks:
    -   id: pip-audit
        name: pip-audit (dependency CVEs)
        stages: [pre-push]
        language: system
        entry: bash -c 'for req in services/*/requirements.txt; do echo "auditing $req"; pip-audit -r "$req" --strict --disable-pip; done'
        pass_filenames: false
        files: ^services/.*/requirements\.txt$
