[tool.ruff]
line-length = 100
target-version = "py314"
src = ["services", "shared"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez (naive datetime detection)
    "T20",  # flake8-print (no print in library code)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "ASYNC", # flake8-async
    "FAST",  # fastapi-specific rules
]
ignore = [
    "E501",   # line length handled by formatter
    "S101",   # allow assert in tests
    "B008",   # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"alembic/**/*.py" = ["E501", "N999"]
# S106 fires on the `password_secret=` argument in database.py, which holds the NAME of the secret to fetch, never a password value.
"services/*/app/database.py" = ["S106"]
# S105 fires on `token_type = "bearer"` in schemas.py, a standard OAuth response field name.
"services/*/app/schemas.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["app", "shared"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "google.*",
    "boto3.*",
    "botocore.*",
    "asyncpg.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "alembic", ".venv", "venv"]
skips = ["B101"]  # assert_used — fine in tests, but we already exclude tests

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]
